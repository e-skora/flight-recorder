[project]
name = "flight_recorder"
version = "0.1.0"
description = "GTM Flight Recorder: observability for automated revenue decisions."
readme = "PRODUCT.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    # httpx is a runtime dependency because `flight-recorder seed` submits the
    # canonical fixture through the in-process ASGI app over HTTP semantics.
    "httpx>=0.27",
]

[project.scripts]
flight-recorder = "flight_recorder.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flight_recorder"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "invariant: generative and database-level tests for the core invariants (INV-01..INV-11)",
]
